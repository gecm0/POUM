name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.version.outputs.version }}`,
              name: `POUM v${{ steps.version.outputs.version }}`,
              body: `## What's Changed\n\nSee [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.\n\n## Downloads\n\n| Platform | Download |\n|----------|----------|\n| macOS (Apple Silicon) | \`POUM_${{ steps.version.outputs.version }}_aarch64.dmg\` |\n| macOS (Intel) | \`POUM_${{ steps.version.outputs.version }}_x64.dmg\` |\n| Windows | \`POUM_${{ steps.version.outputs.version }}_x64-setup.exe\` |\n| Linux (AppImage) | \`POUM_${{ steps.version.outputs.version }}_amd64.AppImage\` |\n| Linux (deb) | \`POUM_${{ steps.version.outputs.version }}_amd64.deb\` |\n\n## macOS Installation Note\n\nIf you see **"POUM is damaged and can't be opened"**, run this command in Terminal:\n\n\`\`\`bash\nxattr -cr /Applications/POUM.app\n\`\`\`\n\nOr right-click the app → Open → Open (bypass Gatekeeper on first launch).`,
              draft: true,
              prerelease: false
            })
            core.setOutput('upload_url', data.upload_url)
            return data.id

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-tauri:
    name: Build (${{ matrix.name }})
    needs: [create-release, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app (non-macOS)
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":""}}'
          tauriScript: cargo tauri

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        run: cargo tauri build --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Ad-hoc sign and repackage macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          # Find the .app bundle
          APP_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app bundle"
            exit 1
          fi
          
          echo "Signing $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          
          # Get app name and version for DMG naming
          APP_NAME=$(basename "$APP_PATH" .app)
          VERSION="${{ needs.create-release.outputs.version }}"
          
          # Determine architecture suffix
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi
          
          # Create DMG
          DMG_NAME="${APP_NAME}_${VERSION}_${ARCH}.dmg"
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/${DMG_NAME}"
          
          # Remove old DMG if exists and create new one
          rm -f "$DMG_PATH"
          mkdir -p "$(dirname "$DMG_PATH")"
          
          # Create a simple DMG with the signed app
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload macOS DMG to release
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.DMG_PATH }}
          asset_name: ${{ env.DMG_NAME }}
          asset_content_type: application/x-apple-diskimage

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })
